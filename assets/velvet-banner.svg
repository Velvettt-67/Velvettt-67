<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090F"/>
      <stop offset="60%" stop-color="#0F0E1A"/>
      <stop offset="100%" stop-color="#12121C"/>
    </linearGradient>

    <!-- Velvet Glow Gradients -->
    <radialGradient id="purpleGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#9B5CFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#9B5CFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9B5CFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#48A7FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#48A7FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#48A7FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#EDE8FF"/>
      <stop offset="75%" stop-color="#C8A7FF"/>
      <stop offset="100%" stop-color="#48A7FF"/>
    </linearGradient>

    <!-- Card Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B5CFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#322846" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#48A7FF" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Chip Background Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181528" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E0D18" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#25203A" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="920" height="280" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Grid Background -->
  <rect width="920" height="280" rx="16" fill="url(#grid)"/>

  <!-- Ambient Color Glows -->
  <rect width="920" height="280" rx="16" fill="url(#purpleGlow)"/>
  <rect width="920" height="280" rx="16" fill="url(#blueGlow)"/>

  <!-- Border Outline -->
  <rect x="1" y="1" width="918" height="278" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Top Decorative Circuit / Line Accents -->
  <line x1="40" y1="36" x2="120" y2="36" stroke="#9B5CFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <circle cx="125" cy="36" r="2.5" fill="#9B5CFF" fill-opacity="0.8"/>
  <line x1="130" y1="36" x2="220" y2="36" stroke="#48A7FF" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.5"/>

  <!-- Right Decorative Micro-Data -->
  <g transform="translate(680, 36)" opacity="0.85">
    <rect x="0" y="-8" width="195" height="22" rx="11" fill="#121020" stroke="#3D305E" stroke-width="0.8"/>
    <circle cx="12" cy="3" r="3.5" fill="#48A7FF">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="7" fill="#C8A7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.08em">AVAILABLE FOR WORK</text>
  </g>

  <!-- Identity Pill -->
  <g transform="translate(40, 58)">
    <rect x="0" y="0" width="285" height="24" rx="12" fill="#151226" stroke="#9B5CFF" stroke-width="0.8" stroke-opacity="0.7"/>
    <text x="14" y="16" fill="#C8A7FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="0.12em">ROHIT KANWAL · VELVET</text>
  </g>

  <!-- Main Headline "VELVET" -->
  <text x="40" y="142" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Space Grotesk', sans-serif" font-size="62" font-weight="900" letter-spacing="0.08em">VELVET</text>

  <!-- Role Subtitle -->
  <text x="42" y="174" fill="#F5F5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="0.04em">Creative Developer <tspan fill="#9B5CFF">|</tspan> Software Builder <tspan fill="#48A7FF">|</tspan> Digital Creator</text>

  <!-- Tagline -->
  <text x="42" y="198" fill="#A5A5B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="400" letter-spacing="0.02em">Crafting 3D generative web interfaces, low-latency native desktop utilities &amp; digital community platforms.</text>

  <!-- Bottom Capability Chips -->
  <g transform="translate(40, 226)">
    <!-- Chip 1: 3D WebGL -->
    <g transform="translate(0, 0)">
      <rect width="195" height="28" rx="7" fill="url(#chipBg)" stroke="#2B2446" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#9B5CFF"/>
      <text x="26" y="18" fill="#EDE8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500">Next.js &amp; Three.js 3D WebGL</text>
    </g>

    <!-- Chip 2: Rust & Tauri -->
    <g transform="translate(205, 0)">
      <rect width="185" height="28" rx="7" fill="url(#chipBg)" stroke="#2B2446" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#48A7FF"/>
      <text x="26" y="18" fill="#EDE8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500">Rust &amp; Tauri System Tools</text>
    </g>

    <!-- Chip 3: Community Platforms -->
    <g transform="translate(400, 0)">
      <rect width="205" height="28" rx="7" fill="url(#chipBg)" stroke="#2B2446" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#C8A7FF"/>
      <text x="26" y="18" fill="#EDE8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500">Real-Time Community Hubs</text>
    </g>

    <!-- Chip 4: Performance -->
    <g transform="translate(615, 0)">
      <rect width="210" height="28" rx="7" fill="url(#chipBg)" stroke="#2B2446" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#48A7FF"/>
      <text x="26" y="18" fill="#EDE8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="500">Low-Latency Hardware Tuning</text>
    </g>
  </g>
</svg>
