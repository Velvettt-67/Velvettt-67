<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2328" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1f2328" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#1f2328" stop-opacity="0"/>
