    <clipPath id="line"><rect x="460" y="118" width="280" height="2"/></clipPath>
  </defs>

  <text x="609" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="18" fill="#1f2328">ROHIT</text>

