  <text x="603" y="162" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" letter-spacing="6" fill="#59636e">CREATIVE DEVELOPER  ·  WEB, 3D &amp; WINDOWS TOOLS</text>

  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#424a53">also known as Velvet</text>
</svg>
